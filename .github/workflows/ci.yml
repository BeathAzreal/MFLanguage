name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            cmake -S . -B build -DMFL_WARNINGS_AS_ERRORS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
                  -DMFL_WARNINGS_AS_ERRORS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
